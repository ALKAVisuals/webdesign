<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Projectintro — E mobile integration</title>
</head>
<body>
  <p style="font-family:system-ui;padding:2rem;text-align:center;color:#6f6c65">Projectintro mobiele integratie laden…</p>
  <script>
    const branchRoot = 'https://raw.githack.com/ALKAVisuals/webdesign/agent/projectintro-final-style-lock/technischbouwadvies/ontwerpboek/';
    const source = 'https://raw.githubusercontent.com/ALKAVisuals/webdesign/agent/projectintro-final-style-lock/technischbouwadvies/ontwerpboek/fase-m-m1b-v1.html?v=20260819-2254-e';

    fetch(source, { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Bronpreview niet beschikbaar');
        return response.text();
      })
      .then((html) => {
        html = html
          .replace('<head>', `<head><base href="${branchRoot}">`)
          .replace('Fase M.1B V1 — Papier, schaduw en gutter', 'Projectintro — E mobile integration')
          .replace('</head>', [
            '<link rel="stylesheet" href="style-lock-m1c-projectintro-v1.css?v=20260819-2254-e">',
            '<link rel="stylesheet" href="style-lock-m1c-projectintro-v2.css?v=20260819-2254-e">',
            '<link rel="stylesheet" href="style-lock-m1c-projectintro-final.css?v=20260819-2254-e">',
            '<link rel="stylesheet" href="style-lock-m1c-projectintro-mobile.css?v=20260819-2254-e">',
            '</head>'
          ].join(''))
          .replace('</body>', '<script>window.setTimeout(function(){var b=document.getElementById("coverStart")||document.getElementById("startBook");if(b)b.click();},900);<\/script></body>');
        document.open();
        document.write(html);
        document.close();
      })
      .catch((error) => {
        document.body.innerHTML = `<p style="font-family:system-ui;padding:2rem;text-align:center">Preview kon niet worden geladen. ${error.message}</p>`;
      });
  </script>
</body>
</html>
