<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ontdek de interactieve ontwerpboeken van Technisch Bouwadvies.">
  <title>Ontwerpboeken — Technisch Bouwadvies</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/selector.css">
  <link rel="stylesheet" href="styles/book.css">
  <link rel="stylesheet" href="styles/spreads.css">
  <link rel="stylesheet" href="styles/motion.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <main class="preview-stage" aria-labelledby="preview-title">
    <header class="preview-header">
      <a class="brand" href="#cover" data-action="cover" aria-label="Naar de omslag van het ontwerpboek">
        <span class="brand__monogram" aria-hidden="true">
          <span>T</span><span>B</span>
        </span>
        <span class="brand__name">Technisch<br>Bouwadvies</span>
      </a>

      <div class="preview-heading">
        <h1 id="preview-title">Ontwerpboeken</h1>
        <p class="eyebrow">Projectverhalen · concept en techniek</p>
      </div>

      <p class="preview-status" id="preview-status">Selecteer een projectboek</p>
    </header>

    <section class="cover-state project-selector" id="book-cover" aria-labelledby="selector-title">
      <div class="project-selector__stage" id="project-selector-stage" aria-label="Kies een ontwerpboek">
        <div class="project-selector__books" id="project-books"></div>
      </div>

      <div class="project-selector__details">
        <p class="project-selector__eyebrow">Ontdek onze ontwerpboeken</p>
        <p class="project-selector__intro">Technisch onderbouwd. Esthetisch doordacht. Gebouwd voor de toekomst.</p>

        <div class="project-selector__navigation">
          <button class="project-selector__arrow" id="previous-project" type="button" aria-label="Vorig ontwerpboek">
            <svg aria-hidden="true" viewBox="0 0 48 24"><path d="M2 12h42M11 3 2 12l9 9"/></svg>
          </button>

          <div class="project-selector__project" aria-live="polite" aria-atomic="true">
            <h1 id="selector-title">De Houtkavel</h1>
            <span class="project-selector__rule" aria-hidden="true"></span>
            <p id="project-summary">Van concept naar technisch ontwerp</p>
          </div>

          <button class="project-selector__arrow" id="next-project" type="button" aria-label="Volgend ontwerpboek">
            <svg aria-hidden="true" viewBox="0 0 48 24"><path d="M4 12h42M37 3l9 9-9 9"/></svg>
          </button>
        </div>

        <button class="cover-open" id="open-book" type="button">
          <span>Open ontwerpboek</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h13M14 7l5 5-5 5"/></svg>
        </button>

        <p class="project-selector__position" id="project-position">02 / 03</p>
        <p class="visually-hidden" id="project-selector-live" aria-live="polite"></p>
      </div>
    </section>

    <section class="reader" id="book-reader" aria-label="Interactief ontwerpboek" hidden>
      <div class="book-sequence" id="book-sequence" aria-label="Acht spreads van het ontwerpboek"></div>

      <nav class="reader-controls" aria-label="Navigatie door het ontwerpboek">
        <button class="reader-control reader-control--icon" id="previous-page" type="button" aria-label="Vorige pagina">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
        </button>

        <div class="reader-progress" aria-hidden="true">
          <div class="reader-progress__meta">
            <span id="progress-label">Spread</span>
            <span id="progress-value">01 / 08</span>
          </div>
          <div class="reader-progress__track"><i id="progress-bar"></i></div>
        </div>

        <button class="reader-control reader-control--icon" id="next-page" type="button" aria-label="Volgende pagina">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg>
        </button>

        <button class="reader-control reader-control--text" type="button" data-action="cover">Naar de kaft</button>
      </nav>
    </section>

    <p class="visually-hidden" id="reader-live" aria-live="polite"></p>
  </main>

  <script type="module" src="scripts/book.js"></script>
</body>
</html>
